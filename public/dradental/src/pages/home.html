        <iframe
          title="{{mapTitle}}"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
          src="{{mapEmbedUrl}}"
        ></iframe>
      </div>

    </div>
</section>

<script>
const thumbs = document.querySelectorAll(".thumb");

const mainImg = document.getElementById("mainDoctorImg");
const mainName = document.getElementById("mainDoctorName");
const mainDesc = document.getElementById("mainDoctorDesc");
const mainLink = document.getElementById("mainDoctorLink");

thumbs.forEach(t => {
  t.addEventListener("click", () => {

    thumbs.forEach(x => x.classList.remove("active"));
    t.classList.add("active");

    // smooth swap
    mainImg.style.opacity = 0;

   setTimeout(() => {
   mainImg.src = t.dataset.img;
    mainName.textContent = t.dataset.name;
    mainDesc.textContent = t.dataset.desc;
    mainLink.href = t.dataset.link;

    mainImg.style.opacity = 1;
    }, 200);

  });
});
</script>
